name: CI

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]
  create:
    tags:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate metadata.json
        run: |
          if ! jq . metadata.json; then
            echo "Invalid metadata.json"
            exit 1
          fi

      - name: Compile Schemas
        run: |
          glib-compile-schemas schemas/

      - name: Create Release Zip
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          zip -r mousemove@efren-corillo.github.com.zip . -x "*.git*" "*.github*" "*.sh" "mousemove.log" "last_run_date.txt"

      - name: Upload Artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: mousemove-extension
          path: mousemove@efren-corillo.github.com.zip
